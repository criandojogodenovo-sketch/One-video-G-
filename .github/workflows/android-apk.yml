name: Android Release APK

# One Video G — signed release APK pipeline.
# Builds ONLY the release variant (per project policy), runs unit tests,
# verifies the APK signature with apksigner, uploads the artifact and
# publishes the signed APK to a rolling GitHub Release on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "0.7.0"

jobs:
  release:
    name: Test, build and verify signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Export signing configuration
        run: |
          echo "ANDROID_KEYSTORE_FILE=${{ runner.temp }}/one-video-g-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. Configure the four signing secrets (see docs/RELEASING.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/one-video-g-release.keystore"
          test -s "${RUNNER_TEMP}/one-video-g-release.keystore"

      - name: Run unit tests (release variant)
        run: ./gradlew --no-daemon testReleaseUnitTest --stacktrace

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Verify APK signature (must pass — never publish unverified)
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.out
          grep -q "^Verifies" /tmp/apksigner.out
          grep -q "v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.out
          echo "Signature verified OK"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "OneVideoG-v${APP_VERSION}-release.apk"
          sha256sum "OneVideoG-v${APP_VERSION}-release.apk" | tee OneVideoG-v${APP_VERSION}-release.apk.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneVideoG-release-apk
          path: |
            OneVideoG-v${{ env.APP_VERSION }}-release.apk
            OneVideoG-v${{ env.APP_VERSION }}-release.apk.sha256
          if-no-files-found: error

      - name: Publish signed APK to GitHub Release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: "OneVideoG-v${{ env.APP_VERSION }}-release.apk"
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$APK" "$APK.sha256" \
            --title "One Video G — Signed Release APK (v${APP_VERSION})" \
            --notes "APK de lançamento assinado / Signed release APK.

          Instalação / Install:
          1. Descarregue o ficheiro .apk abaixo.
          2. No Android, toque no ficheiro e autorize a instalação de apps de origem desconhecida se pedido.
          3. A assinatura é verificada automaticamente pelo Android durante a instalação.

          Built offline-first · pt/en · Media3 Transformer export" \
            --latest
          echo "Release published."
